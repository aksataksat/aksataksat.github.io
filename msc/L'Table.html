      { s: "06:15", e: "06:25", d: 10, t: "rout", st: false, n: "Wash & Sit", note: "At desk by 06:25." },
      { s: "06:25", e: "07:35", d: 70, t: "dpp",  st: true,  n: "DPPs Pt 1", note: "70m before bath." },
      { s: "07:35", e: "08:00", d: 25, t: "rout", st: false, n: "Bath & Prayers", note: "Anchor intact." },
      { s: "08:00", e: "08:45", d: 45, t: "rout", st: false, n: "Breakfast", note: "Anchor intact." },
      { s: "08:45", e: "08:50", d: 5,  t: "dpp",  st: true,  n: "DPPs Pt 2", note: "Final 5m (75m total)." },
      { s: "08:50", e: "09:25", d: 35, t: "test", st: true,  n: "Test A + Audit", note: "30m Test A + 5m audit." },
      { s: "09:25", e: "10:00", d: 35, t: "pyq",  st: true,  n: "PYQs Pt 1", note: "35m error PYQs." },
      { s: "10:00", e: "10:15", d: 15, t: "rout", st: false, n: "Break", note: "15m reset." },
      { s: "10:15", e: "10:55", d: 40, t: "pyq",  st: true,  n: "PYQs Pt 2", note: "75m total PYQs." },
      { s: "10:55", e: "11:25", d: 30, t: "rev",  st: true,  n: "Revision", note: "Realigned at 11:25." },
      { s: "11:25", e: "12:20", d: 55, t: "lec",  st: true,  n: "Lecture Pt 1", note: "55m pre-workout." },
      { s: "12:20", e: "13:00", d: 40, t: "rout", st: false, n: "Workout", note: "Anchor intact." },
      { s: "13:00", e: "14:00", d: 60, t: "rout", st: false, n: "Lunch", note: "Anchor intact." },
      { s: "14:00", e: "15:05", d: 65, t: "lec",  st: true,  n: "Lecture Pt 2", note: "Done 15:05." }
    ]
  }
];

let curV = parseInt(localStorage.getItem('tt_var') || '0', 10);
let checks = JSON.parse(localStorage.getItem('tt_checks') || '{}');

document.getElementById('boards-details').addEventListener('toggle', function() {
  document.getElementById('boards-summary').textContent =
    (this.open ? '[-] ' : '[+] ') + 'Visual Boards (The Choice)';
});

document.getElementById('gantt-details').addEventListener('toggle', function() {
  document.getElementById('gantt-summary').textContent =
    (this.open ? '[-] ' : '[+] ') + 'Visual Timeline Comparison (05:00 – 15:05)';
});

function drawGantt() {
  const wrap = document.getElementById('gantt-rows');
  wrap.innerHTML = '';
  const span = 605;
  data.forEach((v, vIdx) => {
    const row = document.createElement('div');
    row.className = 'g-row';
    row.innerHTML = `<div class="g-lbl" style="${vIdx===curV?'text-decoration:underline':''}">${v.name}</div>`;
    const track = document.createElement('div');
    track.className = 'g-track';
    let used = 0;
    v.blocks.forEach((b, bIdx) => {
      const seg = document.createElement('div');
      seg.className = `g-seg ${b.t}`;
      seg.style.width = `${(b.d / span) * 100}%`;
      seg.title = `${b.s}–${b.e}: ${b.n}`;
      if (b.d >= 25) seg.textContent = b.t === 'rout' ? 'R' : b.t === 'empty' ? '—' : b.n.split(' ')[0];
      seg.onclick = () => setVar(vIdx, document.querySelectorAll('.var-btn')[vIdx], bIdx);
      track.appendChild(seg);
      used += b.d;
    });
    if (used < span) {
      const rem = document.createElement('div');
      rem.className = 'g-seg empty';
      rem.style.width = `${((span - used) / span) * 100}%`;
      rem.textContent = 'FREE';
      track.appendChild(rem);
    }
    row.appendChild(track);
    wrap.appendChild(row);
  });
}

function setVar(idx, btn, bIdx = 1) {
  curV = idx;
  localStorage.setItem('tt_var', idx);
  document.querySelectorAll('.var-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const v = data[idx];

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-box"><div class="s-lbl">Window</div><div class="s-val">${v.wake}–${v.stop}</div></div>
    <div class="stat-box"><div class="s-lbl">Study</div><div class="s-val">${v.total}</div></div>
    <div class="stat-box"><div class="s-lbl">DPP</div><div class="s-val">${v.dpp}</div></div>
    <div class="stat-box"><div class="s-lbl">Test</div><div class="s-val">${v.test}</div></div>
    <div class="stat-box"><div class="s-lbl">PYQ / Rev</div><div class="s-val">${v.pyq}</div></div>
    <div class="stat-box"><div class="s-lbl">Lecture</div><div class="s-val">${v.lec}</div></div>
  `;

  const list = document.getElementById('schedule-list');
  list.innerHTML = '';
  v.blocks.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = `s-row ${!b.st ? 'rout-row' : ''} ${i === bIdx ? 'selected' : ''}`;
    const k = `${idx}-${i}`;
    const cb = b.st ? `<input type="checkbox" ${checks[k] ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${k}', this.checked)">` : `—`;
    row.innerHTML = `<div>${cb}</div><div class="s-time">${b.s}–${b.e}</div><div class="s-task">${b.n}</div><div class="s-dur">${b.d}m</div>`;
    row.onclick = () => showBlock(i);
    list.appendChild(row);
  });

  drawGantt();
  showBlock(bIdx);
  evalGate();
}

function showBlock(i) {
  const b = data[curV].blocks[i];
  document.querySelectorAll('.s-row').forEach((r, idx) => r.classList.toggle('selected', idx === i));
  document.getElementById('ins-title').textContent = b.n;
  document.getElementById('ins-time').textContent = `${b.s} – ${b.e} (${b.d}m)`;
  document.getElementById('ins-note').textContent = b.note;
}

function toggleCheck(k, val) {
  checks[k] = val;
  localStorage.setItem('tt_checks', JSON.stringify(checks));
  evalGate();
}

function clearChecks() {
  checks = {};
  localStorage.removeItem('tt_checks');
  setVar(curV, document.querySelectorAll('.var-btn')[curV], 1);
}

function evalGate() {
  const v = data[curV];
  let req = 0, done = 0;
  v.blocks.forEach((b, i) => {
    if (b.st) {
      req += b.d;
      if (checks[`${curV}-${i}`]) done += b.d;
    }
  });
  const rem = req - done;
  const g = document.getElementById('gate-text');
  g.innerHTML = rem === 0
    ? `${done}/${req}m (100%) — COMPLETE. Leisure unlocked.`
    : `${done}/${req}m (${rem}m left) — INCOMPLETE. Unresolved task.`;
}

setVar(curV, document.querySelectorAll('.var-btn')[curV], 1);
</script>
</body></html>
